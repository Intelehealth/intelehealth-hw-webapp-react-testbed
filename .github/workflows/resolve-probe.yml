name: Resolve Probe

# Throwaway diagnostic. Answers one question that blocks the auto-resolve
# feature: can GITHUB_TOKEN, with the same permissions pr-review.yml grants,
# call the resolveReviewThread GraphQL mutation? Public discussion is split
# between "pull-requests: write is enough" and "it needs contents: write", and
# every repro found so far used a GitHub App token or a fine-grained PAT rather
# than GITHUB_TOKEN. Guessing wrong means shipping a feature that silently
# no-ops.
#
# Non-destructive: it resolves one thread and immediately unresolves it again.
# Delete this file once the answer is recorded.

# Triggered by a label rather than workflow_dispatch, because dispatch requires
# the workflow file to be on the default branch and this repo's default branch
# predates the review agent entirely.
on:
  pull_request:
    types: [labeled]

jobs:
  probe:
    if: github.event.label.name == 'resolve-probe'
    runs-on: ubuntu-latest
    # Round 2. Round 1 used the pr-review.yml set (contents: read) and got
    # FORBIDDEN "Resource not accessible by integration". Escalating only
    # contents to write isolates whether that is the missing grant.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Probe resolveReviewThread
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"

          echo "::group::Threads on #$PR"
          gh api graphql -f query="
          { repository(owner: \"$OWNER\", name: \"$NAME\") {
              pullRequest(number: $PR) {
                reviewThreads(first: 50) { nodes {
                  id isResolved isOutdated path line
                  comments(first: 1) { nodes { author { login } } }
                } }
              } } }" > threads.json
          jq -r '.data.repository.pullRequest.reviewThreads.nodes[]
                 | "\(.id) resolved=\(.isResolved) outdated=\(.isOutdated) \(.comments.nodes[0].author.login)"' threads.json
          echo "::endgroup::"

          # First unresolved thread authored by the bot.
          TID=$(jq -r '[.data.repository.pullRequest.reviewThreads.nodes[]
                        | select(.isResolved == false)
                        | select(.comments.nodes[0].author.login | test("github-actions"))][0].id // empty' threads.json)

          if [ -z "$TID" ]; then
            echo "No unresolved bot thread to probe. Inconclusive."
            exit 0
          fi
          echo "Probing thread: $TID"

          echo "::group::resolveReviewThread"
          set +e
          gh api graphql -f query='
            mutation($t: ID!) {
              resolveReviewThread(input: {threadId: $t}) {
                thread { id isResolved }
              }
            }' -f t="$TID" > resolve.json 2> resolve.err
          RC=$?
          set -e
          cat resolve.json resolve.err
          echo "::endgroup::"

          if [ $RC -eq 0 ] && jq -e '.data.resolveReviewThread.thread.isResolved == true' resolve.json >/dev/null 2>&1; then
            echo "RESULT: GITHUB_TOKEN CAN resolve a review thread with contents:read + pull-requests:write."
            echo "Restoring the thread to unresolved so the PR is left as it was."
            gh api graphql -f query='
              mutation($t: ID!) {
                unresolveReviewThread(input: {threadId: $t}) {
                  thread { id isResolved }
                }
              }' -f t="$TID" || echo "WARNING: could not unresolve; thread $TID left resolved."
          else
            echo "RESULT: GITHUB_TOKEN CANNOT resolve. Error type(s):"
            jq -r '.errors[]? | "  type=\(.type) message=\(.message)"' resolve.json 2>/dev/null || true
            grep -o '"type":"[A-Z_]*"' resolve.err 2>/dev/null || true
            echo "  (auto-resolve would then need contents:write or a GitHub App token)"
          fi
